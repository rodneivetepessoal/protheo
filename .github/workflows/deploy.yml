name: Deploy Protheo MVP

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  AWS_REGION: us-east-1
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  # ==================== Backend Build & Deploy ====================
  
  backend:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "ENVIRONMENT=staging" >> $GITHUB_OUTPUT
          else
            echo "ENVIRONMENT=dev" >> $GITHUB_OUTPUT
          fi

      - name: Build backend
        working-directory: backend
        run: |
          mvn clean package -DskipTests
          echo "Backend build completed"

      - name: SAM build
        working-directory: infra
        run: |
          sam build --use-container

      - name: SAM deploy
        working-directory: infra
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name protheo-${{ steps.env.outputs.ENVIRONMENT }} \
            --parameter-overrides $(cat parameters/${{ steps.env.outputs.ENVIRONMENT }}.json | jq -r '.Parameters | to_entries | map("\(.key)=\(.value)") | join(" ")') \
            --capabilities CAPABILITY_IAM \
            --region ${{ env.AWS_REGION }} \
            --s3-prefix protheo-${{ steps.env.outputs.ENVIRONMENT }} \
            --tags Environment=${{ steps.env.outputs.ENVIRONMENT }} Project=Protheo

      - name: Get stack outputs
        id: stack
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name protheo-${{ steps.env.outputs.ENVIRONMENT }} \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiEndpoint`].OutputValue' \
            --output text)
          
          CLOUDFRONT_URL=$(aws cloudformation describe-stacks \
            --stack-name protheo-${{ steps.env.outputs.ENVIRONMENT }} \
            --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontUrl`].OutputValue' \
            --output text)
          
          FRONTEND_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name protheo-${{ steps.env.outputs.ENVIRONMENT }} \
            --query 'Stacks[0].Outputs[?OutputKey==`FrontendBucketName`].OutputValue' \
            --output text)
          
          echo "API_URL=$API_URL" >> $GITHUB_OUTPUT
          echo "CLOUDFRONT_URL=$CLOUDFRONT_URL" >> $GITHUB_OUTPUT
          echo "FRONTEND_BUCKET=$FRONTEND_BUCKET" >> $GITHUB_OUTPUT

    outputs:
      environment: ${{ steps.env.outputs.ENVIRONMENT }}
      api_url: ${{ steps.stack.outputs.API_URL }}
      cloudfront_url: ${{ steps.stack.outputs.CLOUDFRONT_URL }}
      frontend_bucket: ${{ steps.stack.outputs.FRONTEND_BUCKET }}

  # ==================== Frontend Build & Deploy ====================
  
  frontend:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest
    needs: backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Cognito configuration
        id: cognito
        run: |
          USER_POOL_ID=$(aws cloudformation describe-stacks \
            --stack-name protheo-${{ needs.backend.outputs.environment }} \
            --query 'Stacks[0].Outputs[?OutputKey==`UserPoolId`].OutputValue' \
            --output text)
          
          CLIENT_ID=$(aws cloudformation describe-stacks \
            --stack-name protheo-${{ needs.backend.outputs.environment }} \
            --query 'Stacks[0].Outputs[?OutputKey==`UserPoolClientId`].OutputValue' \
            --output text)
          
          echo "USER_POOL_ID=$USER_POOL_ID" >> $GITHUB_OUTPUT
          echo "CLIENT_ID=$CLIENT_ID" >> $GITHUB_OUTPUT

      - name: Create .env file
        working-directory: frontend
        run: |
          cat > .env << EOF
          VITE_API_URL=${{ needs.backend.outputs.api_url }}
          VITE_COGNITO_USER_POOL_ID=${{ steps.cognito.outputs.USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID=${{ steps.cognito.outputs.CLIENT_ID }}
          VITE_COGNITO_REGION=${{ env.AWS_REGION }}
          VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          VITE_COMMISSION_PERCENTAGE=10
          VITE_FIRST_RELEASE_PERCENTAGE=70
          VITE_DISPUTE_PERIOD_DAYS=14
          VITE_MAX_FREE_REVISIONS=2
          VITE_BUDGET_VALIDITY_DAYS=7
          EOF

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Deploy to S3
        working-directory: frontend
        run: |
          aws s3 sync dist/ s3://${{ needs.backend.outputs.frontend_bucket }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "*.json"
          
          # Upload index.html sem cache
          aws s3 cp dist/index.html s3://${{ needs.backend.outputs.frontend_bucket }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Origins.Items[?DomainName=='${{ needs.backend.outputs.frontend_bucket }}.s3.amazonaws.com']].Id" \
            --output text)
          
          if [ -n "$DISTRIBUTION_ID" ]; then
            aws cloudfront create-invalidation \
              --distribution-id $DISTRIBUTION_ID \
              --paths "/*"
          fi

      - name: Deployment summary
        run: |
          echo "### 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.backend.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend URL:** https://${{ needs.backend.outputs.cloudfront_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**API URL:** ${{ needs.backend.outputs.api_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Payment Configuration:**" >> $GITHUB_STEP_SUMMARY
          echo "- Commission: 10%" >> $GITHUB_STEP_SUMMARY
          echo "- First Release: 70%" >> $GITHUB_STEP_SUMMARY
          echo "- Dispute Period: 14 days" >> $GITHUB_STEP_SUMMARY

  # ==================== Update Stripe Webhook ====================
  
  stripe-webhook:
    name: Update Stripe Webhook
    runs-on: ubuntu-latest
    needs: backend
    if: needs.backend.outputs.environment == 'prod'
    
    steps:
