# Quarkus Configuration
quarkus.application.name=protheo-backend
quarkus.lambda.enable-polling-jvm-mode=true

# AWS Lambda SnapStart
quarkus.lambda.snapstart.enabled=true

# AWS SDK Configuration
quarkus.aws.region=${AWS_REGION:us-east-1}
quarkus.dynamodb.sync-client.type=apache

# DynamoDB Tables (from environment variables)
dynamodb.users.table=${USERS_TABLE}
dynamodb.labs.table=${LABS_TABLE}
dynamodb.cases.table=${CASES_TABLE}
dynamodb.budgets.table=${BUDGETS_TABLE}
dynamodb.payments.table=${PAYMENTS_TABLE}
dynamodb.reviews.table=${REVIEWS_TABLE}
dynamodb.consents.table=${CONSENTS_TABLE}

# S3 Configuration
s3.files.bucket=${FILES_BUCKET}
s3.presigned.expiration.minutes=15

# SQS Configuration
sqs.cases.queue.url=${CASES_QUEUE_URL}

# Cognito Configuration
cognito.user.pool.id=${COGNITO_USER_POOL_ID}
cognito.client.id=${COGNITO_CLIENT_ID}

# Payment Configuration (Customizable)
payment.commission.percentage=${COMMISSION_PERCENTAGE:10}
payment.first.release.percentage=${FIRST_RELEASE_PERCENTAGE:70}
payment.dispute.period.days=${DISPUTE_PERIOD_DAYS:14}
payment.max.free.revisions=${MAX_FREE_REVISIONS:2}
payment.budget.validity.days=${BUDGET_VALIDITY_DAYS:7}

# Stripe Configuration
stripe.secret.arn=${STRIPE_SECRET_ARN}

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.protheo".level=DEBUG

# Jackson Configuration
quarkus.jackson.serialization-inclusion=non-null
quarkus.jackson.fail-on-unknown-properties=false
